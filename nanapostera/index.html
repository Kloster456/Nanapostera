<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Repostería Nana</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      background-color: #fff3e8;
      color: #4a2c1d;
    }

    header {
      background-color: #d97b5c;
      color: white;
      text-align: center;
      padding: 40px 20px;
    }

    header h1 {
      font-size: 2.2rem;
      margin-bottom: 10px;
    }

    header p {
      font-size: 1.1rem;
      font-style: italic;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
    }

    h2 {
      margin-bottom: 15px;
      color: #b4532a;
    }

    .menu {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }

    .item {
      background-color: #fff;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .item img {
      width: 100%;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .pedido {
      background-color: #ffe0cf;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      margin-top: 30px;
    }

    .pedido a {
      display: inline-block;
      margin-top: 15px;
      background-color: #25d366;
      color: white;
      padding: 15px 25px;
      border-radius: 30px;
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: bold;
    }

    .pedido a:hover {
      background-color: #1ebe5d;
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 0.9rem;
      color: #6b4a3a;
    }
  </style>
</head>

<body>

  <header>
    <h1>Repostería Nana</h1>
    <p>Dulzura casera hecha con amor 💕</p>
  </header>

  <div class="container">

    <h2>🍰 Nuestro menú</h2>
    <div class="menu">
      <div class="item">
        <img src="magdalenas.jpg" alt="Magdalenas">
        <p>Magdalenas</p>
      </div>
      <div class="item">
        <img src="flan.jpg" alt="Flan">
        <p>Flan</p>
      </div>
      <div class="item">
        <img src="donas.jpg" alt="Donas">
        <p>Donas</p>
      </div>
      <div class="item">
        <img src="brownies.jpg" alt="Brownies">
        <p>Brownies</p>
      </div>
      <div class="item">
        <img src="galletas.jpg" alt="Galletas caseras">
        <p>Galletas caseras</p>
      </div>
    </div>

    <div class="pedido">
      <h2>📲 Hacé tu pedido</h2>
      <p>Pedidos en San Luis, Argentina</p>
      <a href="https://wa.me/54926644684267" target="_blank">
        Pedir por WhatsApp
      </a>
    </div>

  </div>

  <footer>
    © Repostería Nana – San Luis, Argentina
  </footer>

</body>
</html>
